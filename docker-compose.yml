version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fonu-desk-db
    restart: always
    env_file:
      - .env
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fonu-network

  backend:
    image: fonu-desk-backend:latest
    container_name: fonu-desk-backend
    restart: always
    ports:
      - '4000:4000'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - fonu-network

  frontend:
    image: fonu-desk-frontend:latest
    container_name: fonu-desk-frontend
    restart: always
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    networks:
      - fonu-network

volumes:
  pgdata:

networks:
  fonu-network:
    driver: bridge



