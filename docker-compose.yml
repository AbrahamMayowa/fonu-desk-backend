version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: fonu-desk-db
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - fonu-network

  backend:
    image: fonu-desk-backend:latest
    container_name: fonu-desk-backend
    restart: always
    ports:
      - '4000:4000'
    environment:
      - PORT
      - NODE_ENV
      - DATABASE_URL
      - JWT_SECRET
      - FRONTEND_URL
      - CLOUDINARY_CLOUD_NAME
      - CLOUDINARY_API_KEY
      - CLOUDINARY_API_SECRET
      - SMTP_HOST
      - SMTP_PORT
      - SMTP_SECURE
      - SMTP_USER
      - SMTP_PASSWORD
      - SMTP_FROM_EMAIL
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node dist/main.js"
    networks:
      - fonu-network

  frontend:
    build:
      context: ../fonu-desk-frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: fonu-desk-frontend:latest
    container_name: fonu-desk-frontend
    restart: always
    ports:
      - '3000:3000'
    environment:
      - PORT=3000
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    depends_on:
      - backend
    networks:
      - fonu-network

volumes:
  pgdata:

networks:
  fonu-network:
    driver: bridge

